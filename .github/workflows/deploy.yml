name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, queued rather than cancelled.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the game
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      # Creates the Pages site on the first run if it does not exist yet.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is a single self contained file, so there is no build step.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          test -f _site/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
